name: Validate public knowledge-vault template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: OKF and admission structure
        run: python scripts/validate_vault.py .
      - name: Template manifest
        run: python scripts/validate_manifest.py .
      - name: Public disclosure guard
        run: python scripts/audit_public.py .
